name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '^12.61.1', testbench: '^10.0' }
          - { php: '8.3', laravel: '^12.61.1', testbench: '^10.0' }
          - { php: '8.4', laravel: '^12.61.1', testbench: '^10.0' }
          - { php: '8.5', laravel: '^12.61.1', testbench: '^10.0' }
          - { php: '8.3', laravel: '^13.12.0', testbench: '^11.0' }
          - { php: '8.4', laravel: '^13.12.0', testbench: '^11.0' }
          - { php: '8.5', laravel: '^13.12.0', testbench: '^11.0' }
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress -W --with "laravel/framework:${{ matrix.laravel }}" --with "orchestra/testbench:${{ matrix.testbench }}"

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Pest
        run: vendor/bin/pest --compact
